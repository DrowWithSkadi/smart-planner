spring:
  application:
    name: smart-planner

  # Секреты (токен бота) лежат в файле local.properties в корне проекта.
  # Этот файл есть в .gitignore и НЕ попадает в GitHub. Пример — local.properties.example
  config:
    import: optional:file:./local.properties

  datasource:
    # База хранится в файле ./data/smart-planner.mv.db и не пропадает после перезапуска
    url: jdbc:h2:file:./data/smart-planner
    username: sa
    password:

  jpa:
    hibernate:
      # update — Hibernate сам создаёт и дополняет таблицы по сущностям.
      # Для учебного проекта удобно; позже можно перейти на миграции (Flyway).
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      # картинки событий — до 5 МБ (с запасом на служебные данные запроса)
      max-file-size: 6MB
      max-request-size: 7MB

  h2:
    console:
      # Просмотр базы в браузере: http://localhost:8080/h2-console
      # JDBC URL: jdbc:h2:file:./data/smart-planner, пользователь sa, пароль пустой
      enabled: true

server:
  port: 8080

logging:
  file:
    # Логи пишутся ещё и в файл logs/smart-planner.log — так их удобно смотреть и пересылать
    name: logs/smart-planner.log

telegram:
  bot:
    # Адрес Mini App (https!) — например https://xxxx.trycloudflare.com/app/  (см. README)
    # Можно задать здесь через переменную окружения TELEGRAM_BOT_TOKEN
    # или в local.properties строкой telegram.bot.token=...
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    web-app-url: ${TELEGRAM_WEB_APP_URL:}

app:
  default-timezone: Europe/Tallinn
  reminders:
    default-before-minutes: 15
    check-interval-ms: 30000
  calendar:
    # Как часто перекачивать календари (30 минут)
    sync-interval-ms: 1800000
    # Сколько дней прошлого хранить и на сколько дней вперёд разворачивать повторения
    days-behind: 7
    days-ahead: 60
    max-size-mb: 5
    max-per-user: 10
  storage:
    # Папка для картинок событий (она в .gitignore вместе с data/)
    images-dir: ./data/images
  webapp:
    # Сколько часов действительны данные входа из Telegram
    init-data-max-age-hours: 24
    # Режим разработки: открыть интерфейс в обычном браузере (http://localhost:8080/app/)
    # от имени пользователя с этим Telegram ID. Задавай только в local.properties, на сервере не включай!
    # dev-telegram-id: 123456789
